<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tìm kiếm email</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      padding: 40px;
    }
    textarea, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔍 Tìm kiếm Email</h2>
    
    <label>Danh sách email (mỗi dòng 1 email):</label>
    <textarea id="emailList" rows="6" placeholder="nhập danh sách email tại đây..."></textarea>

    <label>Nhập email cần tìm:</label>
    <input type="text" id="searchEmail" placeholder="ví dụ: user@example.com">

    <button onclick="searchEmail()">Tìm</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function searchEmail() {
      const listRaw = document.getElementById('emailList').value.toLowerCase().split('\n').map(e => e.trim());
      const email = document.getElementById('searchEmail').value.trim().toLowerCase();
      const result = document.getElementById('result');

      if (email === "") {
        result.innerHTML = "⚠️ Vui lòng nhập email cần tìm.";
        result.style.color = "orange";
        return;
      }

      if (listRaw.includes(email)) {
        result.innerHTML = `✅ Đã tìm thấy email: <strong>${email}</strong>`;
        result.style.color = "green";
      } else {
        result.innerHTML = "❌ Không tìm thấy email.";
        result.style.color = "red";
      }
    }
  </script>
</body>
</html>
